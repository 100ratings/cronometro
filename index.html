<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Stopwatch">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="apple-touch-startup-image" href="./icons/icon-512x512.png">
</head>
<body>
    <div class="stopwatch-container">
        <div class="time-display" id="timeDisplay">00:00.00</div>

        <!-- Controls (Buttons) -->
        <div class="controls">
            <button id="resetLapBtn" class="control-button reset-lap" disabled>Lap</button>

            <!-- Add this container for the indicator dots -->
            <div class="indicator-dots">
                <span class="indicator-dot dot-white"></span>
                <span class="indicator-dot dot-grey"></span>
            </div>

            <button id="startStopBtn" class="control-button start">Start</button>
        </div>
        <!-- End Controls -->

        <div class="laps">
            <div class="lap-entry current-lap">
                <span>Lap 1</span>
                <span class="lap-time" id="lapTimeDisplay"></span>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item">
            <span class="nav-icon" id="icon-world-clock" style="--icon-url: url('./icons/world-clock.svg');"></span>
            <span class="nav-label">World Clock</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon" id="icon-alarms" style="--icon-url: url('./icons/alarms.svg');"></span>
            <span class="nav-label">Alarms</span>
        </a>
        <a href="#" class="nav-item active">
            <span class="nav-icon" id="icon-stopwatch" style="--icon-url: url('./icons/stopwatch-icon.svg');"></span>
            <span class="nav-label">Stopwatch</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon" id="icon-timers" style="--icon-url: url('./icons/timers.svg');"></span>
            <span class="nav-label">Timers</span>
        </a>
    </nav>

    <script src="./script.js"></script>
</body>
</html>
